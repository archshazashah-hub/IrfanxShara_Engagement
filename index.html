<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7efe3">
  <meta name="description" content="Irfan and Sharafina Engagement Invitation">
  <title>Irfan &amp; Sharafina | Engagement Invitation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f7efe3;
      font-family: Georgia, serif;
      overflow-x: hidden;
    }

    /* OPENING COVER */

    #openingScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7efe3;
      z-index: 5;
      padding: 12px;
    }

    #cover {
      position: relative;
      width: min(100%, 1100px);
      aspect-ratio: 1366 / 935;
      background-image: url("./assets/cover-opener.jpeg");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* DIRECT CANVA LINK */

    #openButton {
      position: absolute;
      left: 50%;
      top: 74.1%;
      transform: translate(-50%, -50%);
      width: 27.5%;
      height: 10.5%;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    #openButton:focus-visible {
      outline: 2px solid #8d7560;
      outline-offset: 4px;
    }

    /* MUSIC CONTROL */

    #musicControl {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      border: 1px solid #b9a48e;
      border-radius: 30px;
      background: #fffaf2;
      color: #65564b;
      padding: 11px 18px;
      font-size: 12px;
      cursor: pointer;
    }

    #musicControl.visible {
      display: block;
    }

    /* SMALL MUSIC MESSAGE */

    #musicMessage {
      display: none;
      position: fixed;
      bottom: 65px;
      right: 18px;
      z-index: 20;
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #806d5c;
      background: #fffaf2;
      padding: 8px 12px;
      border-radius: 20px;
    }

    #musicMessage.visible {
      display: block;
    }

    @media (max-width: 600px) {
      #openingScreen {
        padding: 0;
      }

      #cover {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND MUSIC -->
  <audio
    id="backgroundMusic"
    src="./assets/background-music.mp3"
    preload="auto"
    loop
    playsinline>
  </audio>

  <!-- OPENING COVER -->
  <main id="openingScreen">

    <div id="cover">

      <!--
        IMPORTANT:
        This is a normal HTML link.
        It opens Canva directly in a new tab.
        There is NO iframe.
      -->

      <a
        id="openButton"
        href="https://sharaxirfanengagement.my.canva.site/engagement-invitation-2026"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Irfan and Sharafina invitation">
      </a>

    </div>

  </main>

  <!-- MUSIC CONTROL -->
  <button id="musicControl" type="button">
    ♫ Music: ON
  </button>

  <div id="musicMessage">
    Background music
  </div>

  <script>
    const openButton = document.getElementById("openButton");
    const audio = document.getElementById("backgroundMusic");
    const musicControl = document.getElementById("musicControl");
    const musicMessage = document.getElementById("musicMessage");

    let musicStarted = false;

    /*
      Start music when visitor taps OPEN INVITATION.

      Do not prevent the default link action.
      The browser will open Canva in a new tab.
    */

    openButton.addEventListener("click", function () {

      if (!musicStarted) {
        audio.volume = 1;
        audio.muted = false;

        const playAttempt = audio.play();

        musicStarted = true;

        musicControl.classList.add("visible");
        musicMessage.classList.add("visible");

        if (playAttempt !== undefined) {
          playAttempt.then(function () {
            musicControl.textContent = "♫ Music: ON";
          }).catch(function () {
            musicStarted = false;
            musicControl.textContent = "♫ Tap to Play Music";
          });
        }
      }

    });

    /*
      MUSIC ON / OFF BUTTON
    */

    musicControl.addEventListener("click", function () {

      if (audio.paused) {

        audio.play().then(function () {
          musicControl.textContent = "♫ Music: ON";
        }).catch(function (error) {
          console.log("Audio playback error:", error);
        });

      } else {

        audio.pause();
        musicControl.textContent = "♫ Music: OFF";

      }

    });

    /*
      Show music control if playback starts.
    */

    audio.addEventListener("playing", function () {
      musicControl.classList.add("visible");
      musicControl.textContent = "♫ Music: ON";
    });

  </script>

</body>
</html>
